<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Bukti Penilaian BERLIAN (Kelas X)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .nav-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .back-container {
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            background-color: white;
            border: 2px solid var(--danger-color);
            color: var(--danger-color);
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.2);
        }

        .tabs-kelas {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .konten-kelas {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .konten-kelas.active {
            display: block;
        }

        .judul-kelas {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2rem;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            display: block;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-kriteria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card-kriteria {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid var(--secondary-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-kriteria h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .card-kriteria p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .foto-bukti {
            width: 100%;
            height: 180px;
            background-color: #e9ecef;
            border-radius: 6px;
            object-fit: cover;
            margin-top: auto;
        }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--primary-color);
            color: white;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bukti Penilaian BERLIAN (Kelas 10)</h1>
        <p>Dokumentasi Kriteria Bersih Lingkungan Aman Nyaman per Kelas (Real-time)</p>
    </header>

    <div class="container">
        
        <div class="nav-wrapper">
            <div class="back-container">
                <a href="index.html" class="btn-back">← Kembali ke Menu Utama</a>
            </div>

            <div class="tabs-kelas">
                <button class="tab-btn active" onclick="bukaKelas(event, 'kelas-x1')">Kelas X-1</button>
                <button class="tab-btn" onclick="bukaKelas(event, 'kelas-x2')">Kelas X-2</button>
                <button class="tab-btn" onclick="bukaKelas(event, 'kelas-x3')">Kelas X-3</button>
                <button class="tab-btn" onclick="bukaKelas(event, 'kelas-x4')">Kelas X-4</button>
                <button class="tab-btn" onclick="bukaKelas(event, 'kelas-x5')">Kelas X-5</button>
                <button class="tab-btn" onclick="bukaKelas(event, 'kelas-x6')">Kelas X-6</button>
            </div>
        </div>

        <div id="loading-status" class="loading">Memuat data kriteria BERLIAN dari Spreadsheet...</div>
        <div id="main-content-area"></div>

    </div>

    <footer>
        <p>&copy; 2026 E-Penilaian BERLIAN - Semua Hak Cipta Dilindungi</p>
    </footer>

    <script>
        // MASUKKAN URL GOOGLE WEB APP APPS SCRIPT ANDA DI SINI
        const SPREADSHEET_API_URL = "https://script.google.com/macros/s/AKfycbx2w4BiOnMORqT9I6pGdRf51VSWAezHPMt5tRM_qXH-Jkb0macoZPtqXEcDmu44WPTW/exec"; 

        let globalData = [];

        // Fungsi mengambil data dari Spreadsheet secara real-time
        async function muatDataDariSpreadsheet() {
            try {
                const response = await fetch(SPREADSHEET_API_URL);
                globalData = await response.json();
                
                document.getElementById('loading-status').style.display = 'none';
                
                // Membuat struktur kartu kriteria secara otomatis
                renderSemuaKelas();
                
                // Aktifkan tampilan kelas X-1 di awal halaman terbuka
                tampilkanKelasAktif('kelas-x1');
            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById('loading-status').innerHTML = "Gagal memuat data dari Spreadsheet. Periksa kembali deployment Apps Script Anda.";
            }
        }

        function renderSemuaKelas() {
            const daftarKelas = [
                { id: 'kelas-x1', kodeSheet: 'X-1', namaTeks: 'X-1' },
                { id: 'kelas-x2', kodeSheet: 'X-2', namaTeks: 'X-2' },
                { id: 'kelas-x3', kodeSheet: 'X-3', namaTeks: 'X-3' },
                { id: 'kelas-x4', kodeSheet: 'X-4', namaTeks: 'X-4' },
                { id: 'kelas-x5', kodeSheet: 'X-5', namaTeks: 'X-5' },
                { id: 'kelas-x6', kodeSheet: 'X-6', namaTeks: 'X-6' }
            ];
            
            const containerUtama = document.getElementById('main-content-area');
            containerUtama.innerHTML = '';

            daftarKelas.forEach(kelas => {
                // Saring data berdasarkan nama kelas di kolom spreadsheet
                const kriteriaKelas = globalData.filter(item => item.kelas.toString().trim().toUpperCase() === kelas.kodeSheet);
                
                const kelasDiv = document.createElement('div');
                kelasDiv.id = kelas.id;
                kelasDiv.className = 'konten-kelas';

                let htmlKriteria = '';
                
                // Looping data kriteria dinamis dari sheet docx/spreadsheet Anda
                kriteriaKelas.forEach(item => {
                    htmlKriteria += `
                        <div class="card-kriteria">
                            <h3>${item.kriteria_id}. ${item.kriteria_nama}</h3>
                            <p>${item.deskripsi}</p>
                            <img src="${item.foto_url || 'https://via.placeholder.com/400x300?text=Foto+Belum+Tersedia'}" class="foto-bukti" alt="Bukti Penilaian">
                        </div>
                    `;
                });

                kelasDiv.innerHTML = `
                    <div class="judul-kelas">Bukti Penilaian Kelas  ${kelas.namaTeks}</div>
                    <div class="grid-kriteria">
                        ${htmlKriteria || '<p style="text-align:center; grid-column: 1/-1; color: #999;">Belum ada kriteria penilaian yang diinput di Spreadsheet untuk kelas ini.</p>'}
                    </div>
                `;

                containerUtama.appendChild(kelasDiv);
            });
        }

        function tampilkanKelasAktif(idKelas) {
            const kontenKelas = document.getElementsByClassName("konten-kelas");
            for (let i = 0; i < kontenKelas.length; i++) {
                kontenKelas[i].style.display = "none";
            }
            const target = document.getElementById(idKelas);
            if(target) target.style.display = "block";
        }

        function bukaKelas(evt, idKelas) {
            const tabBtn = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtn.length; i++) {
                tabBtn[i].className = tabBtn[i].className.replace(" active", "");
            }

            tampilkanKelasAktif(idKelas);
            evt.currentTarget.className += " active";
        }

        // Ambil data otomatis saat dokumen dimuat
        window.onload = muatDataDariSpreadsheet;
    </script>
</body>
</html>
